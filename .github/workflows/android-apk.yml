name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: '26.1.10909125'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-android
          shared-key: tomato-ndk
          cache-on-failure: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK with NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Configure NDK & SDK for Rust
        run: |
          echo "SDK root: $ANDROID_SDK_ROOT"
          echo "NDK root: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          mkdir -p android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cat android/local.properties

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile for Android arm64
        run: |
          cargo ndk -t arm64 -o android/app/src/main/assets \
            build --release --target aarch64-linux-android \
            --no-default-features --features no-official-api,tts-native

      - name: Verify binary
        run: |
          ls -la android/app/src/main/assets/
          file android/app/src/main/assets/tomato-novel-downloader*

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache: true

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomanova-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error